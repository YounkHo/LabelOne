[project]
name = "labelone-server"
version = "0.1.0"
description = "Local-first dataset, model adapter, and inference service for LabelOne"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.12",
  "pillow>=11.0",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[project.scripts]
labelone-server = "labelone.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelone"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
